<button type="button" routerLink="/">Voltar</button>

<h1>Cadastre-se</h1>

@if (!cadastroConcluido()) {
  <form (ngSubmit)="cadastrar()">
    <input
      type="email"
      name="email"
      placeholder="Email"
      required
      [ngModel]="email()"
      (ngModelChange)="email.set($event)"
    />
    <input
      type="password"
      name="senha"
      placeholder="Senha"
      required
      [ngModel]="senha()"
      (ngModelChange)="senha.set($event)"
    />
    <button type="submit" [disabled]="enviando()">Cadastrar</button>
  </form>

  @if (erro()) {
    <p class="erro">{{ erro() }}</p>
  }
} @else {
  @if (precisaConfirmarEmail()) {
    <p>Verifique seu e-mail para confirmar sua conta.</p>
  } @else {
    <p>Conta criada. Você está conectado.</p>
  }
}

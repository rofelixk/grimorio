@if (cards().length === 0) {
  <p class="empty">Nenhuma carta aqui ainda.</p>
}

<ul class="card-list">
  @for (card of cards(); track card.id) {
    <li>
      <img [src]="card.imageUrl" [alt]="card.name" width="60" />
      <div class="card-info">
        <strong>{{ card.name }}</strong>
        <span>{{ card.setCode }} #{{ card.collectorNumber }} · {{ card.finish }} · {{ card.condition }}</span>
        <span
          >Qtd. {{ card.quantity }}
          @if (card.forSale) {
            · À venda
          }</span
        >
      </div>
      <button type="button" (click)="removeCard(card.id)">Remover</button>
    </li>
  }
</ul>

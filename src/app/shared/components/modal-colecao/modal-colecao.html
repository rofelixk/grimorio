<div class="fundo" (click)="fechar.emit()">
  <div class="modal" (click)="$event.stopPropagation()">
    <h2>{{ colecao ? 'Editar coleção' : 'Nova coleção' }}</h2>

    <form (ngSubmit)="salvar()">
      <input
        type="text"
        name="nome"
        placeholder="Nome da coleção"
        required
        [ngModel]="nome()"
        (ngModelChange)="nome.set($event)"
      />

      <div class="paleta" role="radiogroup" aria-label="Cor">
        @for (opcao of paleta; track opcao.chave) {
          <button
            type="button"
            class="cor"
            [class.selecionada]="cor() === opcao.chave"
            [style.--cor]="opcao.hex"
            [attr.aria-label]="opcao.rotulo"
            [attr.aria-pressed]="cor() === opcao.chave"
            (click)="cor.set(opcao.chave)"
          ></button>
        }
      </div>

      <button type="submit" [disabled]="enviando()">Salvar</button>
    </form>

    @if (erro()) {
      <p class="erro">{{ erro() }}</p>
    }

    <button type="button" class="fechar" (click)="fechar.emit()">Fechar</button>
  </div>
</div>

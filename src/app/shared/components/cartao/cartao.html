<div class="cartao" [class.multiface]="ehMultiface" (click)="alternarFace()">
  <div class="informacoes">
    <ul>
      <li>{{ nomeExibido }}</li>
      <li>{{ custoDeManaExibido }}</li>
      <li>{{ carta.mana_value }}</li>
      <li>{{ tipoExibido }}</li>
      <li>{{ textoOracleExibido }}</li>
      <li>{{ carta.color_identity.join(', ') }}</li>
    </ul>
  </div>
  @if (imagemExibida) {
    <img [src]="imagemExibida" [alt]="nomeExibido" />
  }
</div>

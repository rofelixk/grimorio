<div class="cartao">
  <div class="informacoes">
    <ul>
      <li>{{ carta.name }}</li>
      <li>{{ custoDeManaExibido }}</li>
      <li>{{ carta.mana_value }}</li>
      <li>{{ carta.type_line }}</li>
      <li>{{ textoOracleExibido }}</li>
      <li>{{ carta.color_identity.join(', ') }}</li>
    </ul>
  </div>
  @if (carta.image_url) {
    <img [src]="carta.image_url" [alt]="carta.name" />
  }
</div>

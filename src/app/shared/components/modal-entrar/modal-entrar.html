<div class="fundo" (click)="fechar.emit()">
  <div class="modal" (click)="$event.stopPropagation()">
    <h2>Sign in</h2>

    <form (ngSubmit)="entrar()">
      <input
        type="email"
        name="email"
        placeholder="Email"
        required
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
      />
      <input
        type="password"
        name="senha"
        placeholder="Password"
        required
        [ngModel]="senha()"
        (ngModelChange)="senha.set($event)"
      />
      <button type="submit" [disabled]="enviando()">Sign in</button>
    </form>

    @if (erro()) {
      <p class="erro">{{ erro() }}</p>
    }

    <button type="button" class="fechar" (click)="fechar.emit()">Close</button>
  </div>
</div>

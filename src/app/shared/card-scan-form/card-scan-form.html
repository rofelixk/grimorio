<div class="scan-form">
  <app-card-scan-capture (frameCaptured)="onFrameCaptured($event)" />

  @if (ocrRunning()) {
    <p class="status">Lendo carta…</p>
  }
  @if (ocrError()) {
    <p class="error">{{ ocrError() }}</p>
  }

  @if (ocrText()) {
    <details class="ocr-debug" open>
      <summary>
        Detectado: edição "{{ guessedSetCode() || '?' }}", nº de coletor {{
          guessedCollectorNumber() || '?'
        }}
      </summary>
      <pre>{{ ocrText() }}</pre>
    </details>
  }

  <app-add-card-form
    [initialSetCode]="guessedSetCode()"
    [initialCollectorNumber]="guessedCollectorNumber()"
    (cardAdded)="onCardAdded($event)"
  />
</div>

<span class="sync-indicator" aria-live="polite">
  @switch (status()) {
    @case ('fresh') {
      <span class="chip fresh">
        <i class="dot" aria-hidden="true"></i>
        {{ freshLabel() }}
      </span>
    }
    @case ('stale') {
      <button type="button" class="chip stale" (click)="sync()">
        <i class="dot breathing" aria-hidden="true"></i>
        {{ staleLabel() }}
      </button>
    }
    @case ('syncing') {
      <span class="chip syncing" aria-busy="true">
        <i class="ring" aria-hidden="true"></i>
        Sincronizando…
      </span>
    }
    @case ('error') {
      <button type="button" class="chip error" (click)="sync()">
        <i class="dot" aria-hidden="true"></i>
        Falhou · Tentar de novo
      </button>
    }
  }
</span>

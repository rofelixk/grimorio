<div
  class="plate"
  role="link"
  tabindex="0"
  [style.--pip]="pip()"
  [attr.aria-label]="node().name + ', ' + totalCards() + ' cartas'"
  (click)="open()"
  (keydown)="onKeydown($event)"
>
  <span class="edge" aria-hidden="true">
    <span class="edge-bar"></span>
    <span class="edge-wash"></span>
    <span class="sparks">
      @for (i of sparkIndices; track i) {
        <span class="spark-edge" [style.--i]="i"></span>
      }
    </span>
  </span>

  <span class="col-main">
    <b class="name">{{ node().name }}</b>
    <span class="chips">
      @for (chip of chips().shown; track chip.id) {
        <a class="chip" [routerLink]="['/collection', chip.id]" (click)="$event.stopPropagation()">
          <span class="chip-name">{{ chip.name }}</span>
          <span class="chip-count">{{ chip.count }}</span>
        </a>
      }
      @if (chips().overflowLabel) {
        <span class="chip-overflow">{{ chips().overflowLabel }}</span>
      }
    </span>
  </span>

  <span class="plate-count">
    <b>{{ totalCards() }}</b>
    <span class="micro">cartas</span>
  </span>
</div>

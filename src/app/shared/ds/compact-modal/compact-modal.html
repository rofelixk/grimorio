<dialog
  #dialog
  class="dialog"
  data-grm
  data-theme-scope
  [class.size-wide]="size() === 'wide'"
  [class.size-split]="size() === 'split'"
  [attr.aria-labelledby]="labelledBy()"
  [style.--theme-primary]="roles().primary"
  [style.--theme-primary-hover]="roles().primaryHover"
  [style.--theme-accent]="roles().accent"
  [style.--theme-accent-hover]="roles().accentHover"
  [style.--theme-tertiary]="roles().tertiary"
  [style.--theme-tertiary-hover]="roles().tertiaryHover"
  (cancel)="onCancel($event)"
>
  <div class="ring">
    <div class="halo" aria-hidden="true"></div>
    <div #face class="face">
      <div #content class="content">
        @if (mobile()) {
          <header class="m-header">
            <span class="wordmark">{{ wordmark }}</span>
            @if (closable()) {
              <button
                type="button"
                class="close"
                [attr.aria-label]="closeLabel"
                [attr.aria-disabled]="locked() || null"
                (click)="requestClose()"
              >✕</button>
            }
          </header>
        } @else {
          <div class="close-row">
            @if (closable()) {
              <button
                type="button"
                class="close"
                [attr.aria-label]="closeLabel"
                [attr.aria-disabled]="locked() || null"
                (click)="requestClose()"
              >✕</button>
            }
          </div>
        }
        <div class="body">
          <ng-content />
        </div>
      </div>
    </div>
  </div>
  <app-toast-outlet [active]="true" />
</dialog>

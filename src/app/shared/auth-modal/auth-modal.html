<dialog #dialog class="auth-modal" aria-labelledby="auth-modal-title" (close)="onDialogClosed()">
  <div class="ambient-glow" aria-hidden="true"></div>
  <div class="sparks" aria-hidden="true">
    <span class="spark" style="--angle: 2deg; --start: 178px; --end: 250px; --dur: 0.8s; --delay: 0s"></span>
    <span class="spark" style="--angle: 20deg; --start: 192px; --end: 266px; --dur: 0.9s; --delay: 0.5s"></span>
    <span class="spark" style="--angle: 38deg; --start: 180px; --end: 252px; --dur: 0.7s; --delay: 1.2s"></span>
    <span class="spark" style="--angle: 56deg; --start: 198px; --end: 272px; --dur: 1s; --delay: 2s"></span>
    <span class="spark" style="--angle: 74deg; --start: 184px; --end: 258px; --dur: 0.8s; --delay: 0.3s"></span>
    <span class="spark" style="--angle: 92deg; --start: 200px; --end: 278px; --dur: 1.1s; --delay: 2.8s"></span>
    <span class="spark" style="--angle: 110deg; --start: 188px; --end: 262px; --dur: 0.9s; --delay: 3.6s"></span>
    <span class="spark" style="--angle: 128deg; --start: 178px; --end: 250px; --dur: 0.7s; --delay: 1.6s"></span>
    <span class="spark" style="--angle: 146deg; --start: 196px; --end: 270px; --dur: 1s; --delay: 4.4s"></span>
    <span class="spark" style="--angle: 164deg; --start: 182px; --end: 255px; --dur: 0.8s; --delay: 0.9s"></span>
    <span class="spark" style="--angle: 182deg; --start: 190px; --end: 264px; --dur: 0.9s; --delay: 5.2s"></span>
    <span class="spark" style="--angle: 200deg; --start: 200px; --end: 276px; --dur: 1.1s; --delay: 2.4s"></span>
    <span class="spark" style="--angle: 218deg; --start: 180px; --end: 250px; --dur: 0.7s; --delay: 3.2s"></span>
    <span class="spark" style="--angle: 236deg; --start: 194px; --end: 268px; --dur: 1s; --delay: 0.1s"></span>
    <span class="spark" style="--angle: 254deg; --start: 186px; --end: 258px; --dur: 0.8s; --delay: 4s"></span>
    <span class="spark" style="--angle: 272deg; --start: 198px; --end: 274px; --dur: 1.1s; --delay: 1.4s"></span>
    <span class="spark" style="--angle: 290deg; --start: 180px; --end: 252px; --dur: 0.7s; --delay: 5.6s"></span>
    <span class="spark" style="--angle: 308deg; --start: 192px; --end: 266px; --dur: 0.9s; --delay: 2.2s"></span>
    <span class="spark" style="--angle: 326deg; --start: 184px; --end: 258px; --dur: 0.8s; --delay: 0.7s"></span>
    <span class="spark" style="--angle: 344deg; --start: 196px; --end: 270px; --dur: 1s; --delay: 3.8s"></span>
  </div>

  <div class="modal-surface">
    <div class="modal-header">
      <h2 id="auth-modal-title">{{ mode() === 'signUp' ? 'Cadastrar' : 'Logar' }}</h2>
      <button type="button" class="close-button" (click)="requestClose()" [disabled]="submitting()" aria-label="Fechar">✕</button>
    </div>

    <div class="modal-body">
      <form (submit)="$event.preventDefault(); submit()">
        <div class="mode-switch" role="group" aria-label="Alternar entre logar e cadastrar">
          <button type="button" class="mode-switch-option" [class.active]="mode() === 'signIn'" [attr.aria-pressed]="mode() === 'signIn'" [disabled]="submitting()" (click)="setMode('signIn')">Logar</button>
          <button type="button" class="mode-switch-option" [class.active]="mode() === 'signUp'" [attr.aria-pressed]="mode() === 'signUp'" [disabled]="submitting()" (click)="setMode('signUp')">Cadastrar</button>
        </div>

        <label>
          {{ mode() === 'signUp' ? 'Email' : 'Email ou nome de usuário' }}
          <input
            [type]="mode() === 'signUp' ? 'email' : 'text'"
            [value]="identifier()"
            (input)="identifier.set($any($event.target).value)"
            [attr.autocomplete]="mode() === 'signUp' ? 'email' : 'username'"
          />
        </label>

        <div class="collapse" [class.expanded]="mode() === 'signUp'" [attr.inert]="mode() === 'signUp' ? null : ''">
          <div class="collapse-inner">
            <label>
              Nome de usuário (opcional)
              <input
                type="text"
                [value]="username()"
                (input)="username.set($any($event.target).value)"
                autocomplete="username"
              />
            </label>
          </div>
        </div>

        <label>
          Senha
          <input
            type="password"
            [value]="password()"
            (input)="password.set($any($event.target).value)"
            [attr.autocomplete]="mode() === 'signUp' ? 'new-password' : 'current-password'"
          />
        </label>

        @if (error()) {
          <p class="error">{{ error() }}</p>
        }

        <div class="actions">
          <button type="submit" class="btn-primary" [disabled]="submitting()">
            {{ mode() === 'signUp' ? 'Criar conta' : 'Entrar' }}
          </button>
        </div>

        <div class="collapse" [class.expanded]="submitting()">
          <div class="collapse-inner spinner-row">
            <span class="spinner" aria-hidden="true"></span>
          </div>
        </div>
      </form>
    </div>
  </div>
</dialog>

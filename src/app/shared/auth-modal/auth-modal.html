<dialog #dialog class="auth-modal" (close)="onDialogClosed()">
  <form (submit)="$event.preventDefault(); submit()">
    <h2>{{ mode() === 'signUp' ? 'Cadastrar' : 'Logar' }}</h2>

    <label>
      Email
      <input
        type="email"
        [value]="email()"
        (input)="email.set($any($event.target).value)"
        autocomplete="email"
      />
    </label>
    <label>
      Senha
      <input
        type="password"
        [value]="password()"
        (input)="password.set($any($event.target).value)"
        autocomplete="current-password"
      />
    </label>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <div class="actions">
      <button type="submit" [disabled]="submitting()">
        @if (submitting()) {
          {{ mode() === 'signUp' ? 'Cadastrando…' : 'Logando…' }}
        } @else {
          {{ mode() === 'signUp' ? 'Cadastrar' : 'Logar' }}
        }
      </button>
      <button type="button" (click)="requestClose()">Cancelar</button>
    </div>

    <p class="toggle-mode">
      @if (mode() === 'signUp') {
        Já tem uma conta? <a href="javascript:void(0)" (click)="toggleMode()">Logar</a>
      } @else {
        Não tem uma conta? <a href="javascript:void(0)" (click)="toggleMode()">Cadastrar</a>
      }
    </p>
  </form>
</dialog>

<span class="auth-control">
  @if (user(); as u) {
    <a routerLink="/profile" class="display-name">{{ displayName() }}</a>
    <button type="button" (click)="signOut()">Sair</button>
  } @else {
    <button type="button" (click)="showModal.set(true)">Logar</button>
  }
</span>

<app-auth-modal [open]="showModal()" (closed)="showModal.set(false)" />

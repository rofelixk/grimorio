<dialog
  #dialog
  class="auth-modal"
  aria-labelledby="auth-modal-title"
  (close)="onDialogClosed()"
  [style.--modal-primary]="themeService.roles().primary"
  [style.--modal-primary-hover]="themeService.roles().primaryHover"
  [style.--modal-accent]="themeService.roles().accent"
  [style.--modal-accent-hover]="themeService.roles().accentHover"
  [style.--modal-tertiary]="themeService.roles().tertiary"
  [style.--modal-tertiary-hover]="themeService.roles().tertiaryHover"
>
  <div class="ambient-glow" aria-hidden="true"></div>
  <div class="sparks" aria-hidden="true">
    <!-- --i alone gives the shared seed formula (_motion.scss) a distinct
         starting angle/timing per spark; SparkRerollDirective rerolls each
         spark's own path on every animation loop after that. -->
    @for (i of sparkIndices; track i) {
      <span class="spark" appSparkReroll [style.--i]="i"></span>
    }
  </div>

  <div class="modal-surface">
    <div class="modal-header">
      <h2 id="auth-modal-title">{{ mode() === 'signUp' ? 'Cadastrar' : 'Logar' }}</h2>
      <button type="button" class="close-button" (click)="requestClose()" [disabled]="submitting()" aria-label="Fechar">✕</button>
    </div>

    <div class="modal-body">
      <form (submit)="$event.preventDefault(); submit()">
        <div class="mode-switch" role="group" aria-label="Alternar entre logar e cadastrar">
          <button type="button" class="mode-switch-option signin" [class.active]="mode() === 'signIn'" [attr.aria-pressed]="mode() === 'signIn'" [disabled]="submitting()" (click)="setMode('signIn')">Logar</button>
          <button type="button" class="mode-switch-option signup" [class.active]="mode() === 'signUp'" [attr.aria-pressed]="mode() === 'signUp'" [disabled]="submitting()" (click)="setMode('signUp')">Cadastrar</button>
        </div>

        <label>
          {{ mode() === 'signUp' ? 'Email' : 'Email ou nome de usuário' }}
          <input
            [type]="mode() === 'signUp' ? 'email' : 'text'"
            [value]="identifier()"
            (input)="identifier.set($any($event.target).value)"
            [attr.autocomplete]="mode() === 'signUp' ? 'email' : 'username'"
          />
        </label>

        <div class="collapse" [class.expanded]="mode() === 'signUp'" [attr.inert]="mode() === 'signUp' ? null : ''">
          <div class="collapse-inner">
            <label>
              Nome de usuário (opcional)
              <input
                type="text"
                [value]="username()"
                (input)="username.set($any($event.target).value)"
                autocomplete="username"
              />
            </label>

            <p class="picker-label">Identidade (escolha até 3)</p>
            <app-color-theme-picker />
          </div>
        </div>

        <label>
          Senha
          <input
            type="password"
            [value]="password()"
            (input)="password.set($any($event.target).value)"
            [attr.autocomplete]="mode() === 'signUp' ? 'new-password' : 'current-password'"
          />
        </label>

        @if (error()) {
          <p class="error">{{ error() }}</p>
        }

        <div class="actions">
          <button type="submit" class="btn-primary" [disabled]="submitting()">
            {{ mode() === 'signUp' ? 'Criar conta' : 'Entrar' }}
          </button>
        </div>

        <div class="collapse" [class.expanded]="submitting()">
          <div class="collapse-inner spinner-row">
            <span class="spinner" aria-hidden="true"></span>
          </div>
        </div>
      </form>
    </div>
  </div>
</dialog>

<dialog
  #dialog
  id="grm-drawer"
  tabindex="-1"
  [attr.aria-label]="copy.menu"
  (cancel)="onCancel($event)"
>
  <span class="thread" aria-hidden="true"></span>
  <span class="wash" aria-hidden="true"></span>
  <div class="header">
    <button #closeButton type="button" class="close" [attr.aria-label]="copy.close" (click)="close()">✕</button>
  </div>
  <div class="account">
    <app-profile-control variant="drawer" (activate)="onProfile()" />
    <app-sync-status variant="drawer" (action)="onSyncAction($event)" />
  </div>
  <hr class="rule" />
  <nav [attr.aria-label]="copy.navLabel">
    <app-nav-links [mirrored]="true" [showLabels]="true" />
  </nav>
</dialog>

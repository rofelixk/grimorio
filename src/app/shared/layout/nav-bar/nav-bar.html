<header class="nav-bar">
  <button
    type="button"
    class="menu-toggle"
    (click)="toggleDrawer()"
    [attr.aria-expanded]="drawerOpen()"
    aria-controls="nav-drawer"
    aria-label="Abrir menu"
  >
    ☰
  </button>
  <app-brand-mark (click)="closeDrawer()" />
  <span class="chrome-divider"></span>
</header>

@if (drawerOpen()) {
  <button type="button" class="drawer-backdrop" aria-label="Fechar menu" (click)="closeDrawer()"></button>
}

<nav id="nav-drawer" class="drawer" [class.open]="drawerOpen()">
  <section class="drawer-group acervo">
    <span class="group-heading"><h2>Acervo</h2><i class="rule"></i></span>
    <a routerLink="/decks" routerLinkActive="active" (click)="closeDrawer()"
      >Decks<b class="count">{{ decksCount() }}</b></a
    >
    <a routerLink="/collection" routerLinkActive="active" (click)="closeDrawer()"
      >Coleção<b class="count">{{ collectionCount() }}</b></a
    >
  </section>
  @if (collectionLocationId(); as locId) {
    <app-collection-filters [locationId]="locId" />
  }
  <section class="drawer-group">
    <a routerLink="/about" routerLinkActive="active" (click)="closeDrawer()">Sobre</a>
  </section>
</nav>

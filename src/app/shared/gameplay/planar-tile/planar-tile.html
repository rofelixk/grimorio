<button
  type="button"
  class="tile"
  [class.is-off]="!on()"
  [attr.aria-pressed]="on()"
  [attr.aria-label]="label()"
  (click)="toggled.emit()"
>
  <app-planar-image [address]="card().images.large" [name]="card().name" [lazy]="true" />
  <span class="bead" aria-hidden="true"></span>
</button>

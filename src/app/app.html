<app-top-bar />
<div class="shell-row">
  @if (shell.wide()) {
    <app-side-nav />
  }
  <main #main class="view-area">
    <router-outlet />
    <app-legal-notice />
  </main>
</div>
@if (!shell.wide()) {
  <app-nav-drawer />
}
@if (profileModal.isOpen()) {
  <app-profile-modal />
}
@if (entryModal.isOpen()) {
  <app-entry-modal />
}
@if (storageHealth.reloadRequired()) {
  <app-reload-prompt />
}
<app-toast-outlet />

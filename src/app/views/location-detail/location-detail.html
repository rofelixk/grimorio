@if (location(); as loc) {
  <nav class="breadcrumb">
    <a routerLink="/locations">Coleção</a>
    @for (crumb of breadcrumb(); track crumb.id) {
      <span> / </span>
      <a [routerLink]="['/locations', crumb.id]">{{ crumb.name }}</a>
    }
  </nav>

  <h1>{{ loc.name }}</h1>

  <section>
    <h2>Sublocais</h2>
    <app-location-children [parentId]="loc.id" />
  </section>

  <section>
    <h2>Cartas aqui</h2>
    <app-card-list [cards]="cardsHere()" (remove)="removeCard($event)" />

    <div class="add-mode-toggle">
      <button type="button" (click)="addMode.set('manual')" [class.active]="addMode() === 'manual'">
        Inserir manualmente
      </button>
      <button type="button" (click)="addMode.set('scan')" [class.active]="addMode() === 'scan'">
        Escanear carta
      </button>
    </div>

    @if (addMode() === 'manual') {
      <app-add-card-form (cardAdded)="addCard($event)" />
    } @else {
      <app-card-scan-form (cardAdded)="addCard($event)" />
    }
  </section>
} @else {
  <p>Local não encontrado.</p>
  <a routerLink="/locations">Voltar à coleção</a>
}

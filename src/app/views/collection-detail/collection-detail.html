@if (location(); as loc) {
  <nav class="breadcrumb">
    <a routerLink="/collection">Coleção</a>
    @for (crumb of breadcrumb(); track crumb.id) {
      <span> / </span>
      <a [routerLink]="['/collection', crumb.id]">{{ crumb.name }}</a>
    }
  </nav>

  <h1>{{ loc.name }}</h1>

  <section>
    <h2>Sublocais</h2>
    <app-collection-children [parentId]="loc.id" />
  </section>

  <section>
    <h2>Cartas aqui</h2>
    <app-card-list [cards]="cardsHere()" (remove)="removeCard($event)" />

    <button type="button" class="btn-primary" (click)="showAddModal.set(true)">Adicionar carta</button>
    <app-add-card-modal
      [open]="showAddModal()"
      context="collection"
      [locationId]="loc.id"
      (closed)="showAddModal.set(false)"
    />
  </section>
} @else {
  <p>Local não encontrado.</p>
  <a routerLink="/collection">Voltar à coleção</a>
}

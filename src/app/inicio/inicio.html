<button type="button" routerLink="/baralhos">Decks</button>
<button type="button" routerLink="/colecao">Collection</button>

<div class="busca">
  <input
    type="text"
    placeholder="Search cards..."
    [value]="termo()"
    (input)="termo.set($any($event.target).value)"
  />
  <select [value]="campo()" (change)="campo.set($any($event.target).value)">
    <option value="name">Name</option>
    <option value="type_line">Type line</option>
  </select>
  <button type="button" (click)="buscar()" [disabled]="carregando()">Search</button>
</div>

@if (termoInvalido) {
  <p class="erro-validacao">Enter at least 3 characters to search.</p>
}

@if (carregando()) {
  <div class="carregando" role="status" aria-label="Loading"></div>
}

@if (erro()) {
  <p class="erro">{{ erro() }}</p>
}

@if (resultados() !== null && !carregando()) {
  @if (resultados()!.length === 0) {
    <p>No results.</p>
  } @else {
    <ul class="lista-resultados">
      @for (item of resultados(); track item.oracle_id) {
        <li>
          <app-cartao [carta]="item" />
        </li>
      }
    </ul>
  }
}
